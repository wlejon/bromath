version: 2

# bromath has no third-party dependencies — the headers include only <cmath>,
# <cstdint>, <limits>, <vector> and <unordered_map>. So there is no package
# manifest to watch, and the only versioned things in the repo are the pinned
# actions in .github/workflows/.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [ci]
    commit-message:
      prefix: "ci"
